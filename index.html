<meta charset="utf-8">
<title>Twenty Minute Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: one narrow reading column; a quiet top bar with Today / Course / Glossary; a session is a four-step path (warm-up, lesson, quiz, wrap) with a sticky listening bar. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --fg:#13222d; --muted:#53666f; --line:#d8e1e6;
  --accent:#0b6e79; --accent-fg:#ffffff; --accent-soft:#dff0f2;
  --hl:#ffe08a; --hl-fg:#13222d;
  --good:#1b7a4b; --good-soft:#dcf2e5; --bad:#b3372c; --bad-soft:#fbe4e1;
  --box-ex:#e6f1fb; --box-tip:#fff1d6; --box-mem:#ece6fa; --box-pause:#e4f3ea; --box-case:#f9e5ea; --box-real:#e8eef0; --box-beyond:#f1ebe0; --box-clear:#e0f0f0;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171d; --surface:#15232b; --fg:#e6eef2; --muted:#9db0b9; --line:#27383f;
  --accent:#4fc3cf; --accent-fg:#06262b; --accent-soft:#12383d;
  --hl:#6b5a14; --hl-fg:#fff6d6;
  --good:#5fd197; --good-soft:#143a27; --bad:#ff8f84; --bad-soft:#431e1a;
  --box-ex:#142a3d; --box-tip:#3a2f12; --box-mem:#26203f; --box-pause:#15332a; --box-case:#3b1a24; --box-real:#1c2b31; --box-beyond:#2d2819; --box-clear:#12302f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171d; --surface:#15232b; --fg:#e6eef2; --muted:#9db0b9; --line:#27383f;
  --accent:#4fc3cf; --accent-fg:#06262b; --accent-soft:#12383d;
  --hl:#6b5a14; --hl-fg:#fff6d6;
  --good:#5fd197; --good-soft:#143a27; --bad:#ff8f84; --bad-soft:#431e1a;
  --box-ex:#142a3d; --box-tip:#3a2f12; --box-mem:#26203f; --box-pause:#15332a; --box-case:#3b1a24; --box-real:#1c2b31; --box-beyond:#2d2819; --box-clear:#12302f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin-right:auto}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{padding-block:20px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.today h2{font-size:1.7rem;margin-block:6px 8px}
.today p{margin:0 0 14px;color:var(--muted);font-family:var(--f-read)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.chap{display:flex;flex-direction:column;gap:8px}
.chap h3{font-size:1.05rem}
.chap .sub{color:var(--muted);font-size:.85rem}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums}
.dot.done{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.dot.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sess-list{display:flex;flex-direction:column;gap:6px}
.sess-item{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:10px;min-height:44px}
.sess-item .n{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:.85rem;flex:none}
.sess-item.done .n{background:var(--accent);color:var(--accent-fg)}
.sess-item .t{flex:1;min-width:0}
/* session */
.shead{display:flex;flex-direction:column;gap:6px}
.shead h1{font-size:1.8rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.steps{display:flex;gap:6px;margin-block:4px}
.steps button{flex:1;border:0;border-top:4px solid var(--line);background:none;padding:8px 2px 0;text-align:left;font-size:.8rem;color:var(--muted);font-weight:600;min-height:44px}
.steps button.on{border-color:var(--accent);color:var(--fg)}
.steps button.done{border-color:var(--accent)}
.steps small{display:block;font-weight:400}
.lesson{font-family:var(--f-read);font-size:1.12rem;line-height:1.7;display:flex;flex-direction:column;gap:14px}
.lesson h3{font-size:1.35rem;margin-top:10px}
.lesson p{margin:0;max-width:65ch}
.s{border-radius:3px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s.now{background:var(--hl);color:var(--hl-fg)}
.box{border-radius:12px;padding:14px 16px;font-family:var(--f-read);line-height:1.6}
.box .k{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.box h4{font-family:var(--f-display);font-size:1.1rem;margin:2px 0 6px}
.box p{margin:0}
.k-ex{background:var(--box-ex)}.k-tip{background:var(--box-tip)}.k-mem{background:var(--box-mem)}.k-pause{background:var(--box-pause)}.k-case{background:var(--box-case)}.k-real{background:var(--box-real)}.k-beyond{background:var(--box-beyond)}.k-clear{background:var(--box-clear)}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pbar .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pbar select{min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:0 8px;font:inherit;max-width:100%;min-width:0}
.pbar .grow{flex:1;min-width:0}
.icon-btn{width:48px;height:44px;padding:0}
.q{display:flex;flex-direction:column;gap:10px}
.q .qt{font-family:var(--f-read);font-size:1.12rem;line-height:1.5;font-weight:600;margin:0}
.opt{display:flex;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);padding:12px;border-radius:10px;min-height:48px;align-items:flex-start;font-family:var(--f-read)}
.opt b{font-family:var(--f-ui);width:24px;height:24px;border-radius:7px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:.8rem}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.why{padding:12px 14px;border-radius:10px;background:var(--bg);font-family:var(--f-read);border-left:4px solid var(--line)}
.why.ok{border-color:var(--good)}.why.no{border-color:var(--bad)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.take{font-family:var(--f-read);font-size:1.1rem;line-height:1.6;display:flex;flex-direction:column;gap:10px;margin:0;padding-left:1.2em}
.terms{display:grid;gap:8px}
.terms div{font-family:var(--f-read)}
.terms b{font-family:var(--f-ui)}
input[type=search]{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:0 14px;font:inherit}
.score{font-family:var(--f-display);font-size:2.6rem;line-height:1}
.note{color:var(--muted);font-size:.9rem}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr 1fr;gap:6px}.stat{padding:10px}.lesson{font-size:1.06rem}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.grid{display:grid;gap:14px}
.course{display:flex;flex-direction:column;gap:10px}
.course h2{font-size:1.45rem}
.course .sub{font-family:var(--f-read);color:var(--muted);margin:0}
.empty{border:2px dashed var(--line);background:none;color:var(--muted)}
.empty p{margin:6px 0 0;font-family:var(--f-read)}
.hero h1{font-size:2rem;margin-block:4px 8px}
.hero p{margin:0;font-family:var(--f-read);color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:0 10px;font:inherit}
.filters input{flex:1;min-width:180px}

.fig{margin:4px 0;max-width:65ch}.fig img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.fig figcaption{font-size:.9rem;color:var(--muted);margin-top:6px;font-family:var(--f-ui,inherit)}


.lx{display:flex;flex-direction:column;gap:16px}
.lx .card h3{margin:0 0 6px}
.lx .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dl{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.dl:first-of-type{border-top:0;padding-top:0}
.dl textarea{font:inherit;font-size:1.05rem;width:100%;box-sizing:border-box;min-height:2.8em;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);resize:vertical}
.dres{font-family:var(--f-read);font-size:1.08rem;line-height:1.7}
.dres .ok{color:var(--good);font-weight:600}
.dres .no{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px;font-weight:600}
.dres .ex{color:var(--muted);text-decoration:line-through}
.dres .en{color:var(--muted);font-size:.95rem}
.pv{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--f-read);font-size:1.05rem;line-height:1.5}
.pv>div{padding:9px 12px;border-top:1px solid var(--line)}
.pv>div:nth-child(-n+2){border-top:0}
.pv .hd{font-family:var(--f-ui);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--hl)}
.pv .de{cursor:pointer;border-right:1px solid var(--line)}
.pv .de:hover,.pv .de.now{background:var(--hl)}
.pv.hide-en .enc,.pv.hide-de .de{color:transparent;text-shadow:0 0 9px var(--muted);user-select:none}
.pv .add{display:block;font-family:var(--f-ui);font-size:.75rem;color:var(--muted)}
.vw{display:grid;gap:8px}
.vw button.btn{padding:4px 10px;min-height:0}
.fl{font-family:var(--f-read);font-size:1.1rem;line-height:1.7}
.fl span.now{background:var(--hl);border-radius:4px}
@media (max-width:420px){.pv{font-size:.95rem}.pv>div{padding:8px}}
</style>

<div class="top"><div class="wrap" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%">
  <div class="brand" id="brand" role="link" tabindex="0">Twenty Minute Study</div>

</div></div>

<script id="data" type="application/json">[]</script>
<script type="text/x-twenty" id="app">
(function(){
"use strict";
var COURSES=JSON.parse(document.getElementById("data").textContent);
var KEY="twenty-study-v2",OLDKEY="reinsurance-twenty-v1";
var C=null,SESS=[];
var $=function(id){return document.getElementById(id)};
function h(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}

/* ---------- state ---------- */
var st={rate:1,voice:"",days:[],last:"",done:{},wrong:{}};
var store={courses:{}};
function load(){var found=false;
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o.rate)st.rate=o.rate;if(o.voice)st.voice=o.voice;st.days=o.days||[];st.last=o.last||"";store.courses=o.courses||{};found=true}}catch(e){}
  if(!found){try{var r2=localStorage.getItem(OLDKEY);if(r2){var p=JSON.parse(r2);st.rate=p.rate||1;st.voice=p.voice||"";st.days=p.days||[];store.courses.reinsurance={done:p.done||{},wrong:p.wrong||{}};st.last="reinsurance"}}catch(e){}}
  COURSES.forEach(function(c){var s=store.courses[c.id]=store.courses[c.id]||{};s.done=s.done||{};s.wrong=s.wrong||{}})}

/* ---------- sync across devices (optional: needs the db and user capabilities) ---------- */
var syncRef=null,pushTimer=null,syncState="off";
function payload(){return {days:st.days,last:st.last,t:st.t||0,courses:store.courses}}

  (r.days||[]).forEach(function(d){if(st.days.indexOf(d)<0){st.days.push(d);changed=true}});

    for(var k in (R.done||{})){var a=L.done[k],b=R.done[k];if(!a||(b.d||"")>(a.d||"")||((b.d||"")===(a.d||"")&&b.s>a.s)){L.done[k]=b;changed=true}}
    if((r.t||0)>(st.t||0)){if(JSON.stringify(L.wrong)!==JSON.stringify(R.wrong||{})){L.wrong=R.wrong||{};changed=true}}});

function showSync(){var e=$("sync");if(e)e.textContent=syncState==="on"?"Synced across your devices":syncState==="err"?"Sync problem: progress is saved on this device only":""}
async function startSync(){

    var first=true;
    syncRef.onSnapshot(function(snap){
      var r=snap.exists?snap.data():null;var ch=mergeRemote(r);if(ch){var c=C&&store.courses[C.id];if(C){st.done=store.courses[C.id].done;st.wrong=store.courses[C.id].wrong}save(false)}
      syncState="on";
      if(first){first=false;if(!r||JSON.stringify(payload())!==JSON.stringify({days:r.days||[],last:r.last||"",t:r.t||0,courses:r.courses||{}}))pushSoon()}
      if(ch&&view!=="session"){render()}showSync()},
      function(){syncState="err";showSync()})
  }catch(e){}}
function setCourse(id){for(var i=0;i<COURSES.length;i++)if(COURSES[i].id===id){C=COURSES[i];SESS=C.sess;SESS.forEach(function(s,k){s.i=k});st.done=store.courses[id].done;st.wrong=store.courses[id].wrong;return true}return false}
function cdone(c){return Object.keys(store.courses[c.id].done).length}
function cnext(c){var d=store.courses[c.id].done;for(var i=0;i<c.sess.length;i++)if(!d[i])return i;return -1}
function today(){try{return new Date().toLocaleDateString("en-CA",{timeZone:"Europe/London"})}catch(e){return new Date().toISOString().slice(0,10)}}
function streak(){var set={};st.days.forEach(function(d){set[d]=1});var d=new Date(today()+"T12:00:00Z");var n=0;
  if(!set[d.toISOString().slice(0,10)])d.setUTCDate(d.getUTCDate()-1);
  while(set[d.toISOString().slice(0,10)]){n++;d.setUTCDate(d.getUTCDate()-1)}return n}
function doneCount(){return Object.keys(st.done).length}
function nextIdx(){for(var i=0;i<SESS.length;i++)if(!st.done[i])return i;return -1}
function chn(ch){return (C.chn&&C.chn[ch])||""}
/* ---------- speech ---------- */
var TTS={ok:"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window,units:[],idx:0,playing:false,tok:0,cont:null,voices:[]};
function pickVoices(){if(!TTS.ok)return;var v=speechSynthesis.getVoices()||[];TTS.voices=v.filter(function(x){return /^en/i.test(x.lang)});if(!TTS.voices.length)TTS.voices=v;fillVoiceSel()}

function getVoice(){var v=TTS.voices;for(var i=0;i<v.length;i++)if(v[i].name===st.voice)return v[i];
  for(var j=0;j<v.length;j++)if(/en-GB/i.test(v[j].lang))return v[j];return v[0]||null}
function unmark(){var m=document.querySelectorAll(".s.now");for(var i=0;i<m.length;i++)m[i].classList.remove("now")}

  if(TTS.idx>=TTS.units.length){TTS.playing=false;unmark();syncBar();return}
  var el=TTS.units[TTS.idx];unmark();el.classList.add("now");
  try{var r=el.getBoundingClientRect();if(r.top<110||r.bottom>innerHeight-110)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}catch(e){}
  var u=new SpeechSynthesisUtterance(el.textContent);var v=getVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";u.rate=st.rate;

function ttsStop(keep){TTS.tok++;TTS.playing=false;if(TTS.ok)try{speechSynthesis.cancel()}catch(e){}unmark();if(!keep)TTS.idx=0;syncBar()}
function ttsFrom(cont,i){if(!TTS.ok)return;var us=Array.prototype.slice.call(cont.querySelectorAll(".s"));if(!us.length)return;
  TTS.tok++;try{speechSynthesis.cancel()}catch(e){}TTS.cont=cont;TTS.units=us;TTS.idx=Math.max(0,Math.min(i,us.length-1));TTS.playing=true;setTimeout(spk,60)}
function ttsToggle(cont){if(TTS.playing){var i=TTS.idx;ttsStop(true);TTS.idx=i;return}
  ttsFrom(cont,TTS.cont===cont?TTS.idx:0)}
function ttsStep(cont,d){var i=(TTS.cont===cont?TTS.idx:0)+d;ttsFrom(cont,Math.max(0,i))}
function fillVoiceSel(){var s=$("vsel");if(!s)return;s.textContent="";TTS.voices.forEach(function(v){var o=h("option",{value:v.name,text:v.name+" ("+v.lang+")"});s.appendChild(o)});
